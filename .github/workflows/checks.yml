name: Mapping checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ['27018:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27018/MappingTest_CI
      - run: pnpm mobile:viewer
      - run: pnpm --filter @mapping/mobile exec tsc --noEmit
      - run: pnpm --filter @mapping/mobile test --runInBand
